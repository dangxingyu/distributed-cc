telegram:
  token: "YOUR_BOT_TOKEN"
  # Only these Telegram user IDs can interact with the bot
  allowed_users:
    - 123456789

# Remote and local servers with Claude Code broker daemons.
# Each server runs one remote_broker.py daemon (per-server, not per-project).
# Sessions register dynamically via `broker-session start` on the remote.
# Access via SSH port forwarding (-L for broker, -R for callbacks).
servers:
  - name: server-a
    host: user@server-a.example.com
    broker_port: 8201       # Local forwarded port → remote broker :8200
    ssh_options: "-o ConnectTimeout=10"
    # Sessions register dynamically — no need to list them here.
    # Run `broker-session start` in each project dir on the remote.

  - name: server-b
    host: user@server-b.example.com
    broker_port: 8202
    ssh_options: ""

  - name: local
    host: null              # null = local machine
    broker_port: 8200       # Local broker running directly

orchestrator:
  model: claude-opus-4-6          # Model for routing decisions
  session_model: claude-opus-4-6  # Model for remote Claude Code sessions
  # Tool permissions for the orchestrator's own Claude session.
  # Similar to .claude/settings.local.json but in our config.
  permissions:
    auto_approve:           # Tools the orchestrator can use freely
      - Read
      - Glob
      - Grep
      - WebSearch
      - WebFetch
    deny: []                # Tools the orchestrator may never use
    # Everything else goes through PermissionEvaluator (Claude judgment → escalate)

permission:
  port: 9120                # HTTP server for broker callbacks

data:
  dir: ./data
