<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>distributed-cc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1e1e2e;
  --bg-secondary: #181825;
  --bg-surface: #242438;
  --bg-hover: #2a2a40;
  --bg-active: #333352;
  --border: #33334d;
  --border-light: #3e3e5c;
  --text-primary: #cdd6f4;
  --text-secondary: #a6adc8;
  --text-muted: #6c7086;
  --blue: #89b4fa;
  --blue-dim: rgba(137, 180, 250, 0.1);
  --green: #a6e3a1;
  --green-dim: rgba(166, 227, 161, 0.1);
  --orange: #fab387;
  --orange-dim: rgba(250, 179, 135, 0.1);
  --yellow: #f9e2af;
  --yellow-dim: rgba(249, 226, 175, 0.1);
  --red: #f38ba8;
  --accent: #cba6f7;
  --accent-dim: rgba(203, 166, 247, 0.15);
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: row;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Scrollbar ──────────────────────────────────── */

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ── Sidebar ─────────────────────────────────────── */

#sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#sidebar-header {
  padding: 16px 18px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

#channel-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 8px;
}

.channel-item {
  padding: 6px 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  transition: all 0.12s ease;
  margin-bottom: 1px;
}

.channel-item:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.channel-item.active {
  background: var(--accent-dim);
  color: var(--accent);
}

.channel-item .ch-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.channel-item .hash {
  color: var(--text-muted);
  font-weight: 700;
  font-size: 15px;
  opacity: 0.6;
}

.channel-item.active .hash {
  color: var(--accent);
  opacity: 1;
}

.channel-item .ch-delete {
  display: none;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
  border-radius: 4px;
  flex-shrink: 0;
  transition: color 0.1s ease;
}

.channel-item:hover .ch-delete {
  display: block;
}

.channel-item .ch-delete:hover {
  color: var(--red);
}

#new-channel-btn {
  margin: 4px 8px 8px;
  padding: 8px 12px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  background: none;
  border: 1px dashed var(--border);
  border-radius: 6px;
  text-align: left;
  transition: all 0.12s ease;
}

#new-channel-btn:hover {
  background: var(--bg-hover);
  color: var(--text-secondary);
  border-color: var(--border-light);
}

/* ── Main area ───────────────────────────────────── */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 0;
  background: var(--bg-primary);
}

#header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  flex-shrink: 0;
}

#header h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}

#header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

#members-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  cursor: pointer;
  position: relative;
  transition: all 0.12s ease;
}

#members-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-light);
}

#members-popover {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  min-width: 220px;
  padding: 6px 0;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

#members-popover.open {
  display: block;
}

.member-item {
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  transition: background 0.1s ease;
}

.member-item:hover {
  background: var(--bg-hover);
}

.member-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.member-dot.user { background: var(--blue); }
.member-dot.orchestrator { background: var(--green); }
.member-dot.worker { background: var(--orange); }

.member-name {
  color: var(--text-primary);
  font-weight: 500;
}

.member-detail {
  color: var(--text-muted);
  font-size: 11px;
  margin-left: auto;
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#status {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}

#status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
}

#status-dot.connected { background: var(--green); }
#status-dot.disconnected { background: var(--red); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#no-channel-msg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 15px;
  gap: 8px;
}

#no-channel-msg::before {
  content: '#';
  font-size: 48px;
  font-weight: 800;
  opacity: 0.15;
}

/* ── Message bubbles ────────────────────────────── */

.msg {
  padding: 6px 0;
  line-height: 1.6;
  max-width: 85%;
}

.msg-user {
  align-self: flex-start;
}

.msg-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}

.msg-sender {
  font-size: 13px;
  font-weight: 600;
}

.msg-user .msg-sender { color: var(--blue); }
.msg-orchestrator .msg-sender { color: var(--green); }
.msg-worker .msg-sender { color: var(--orange); }
.msg-system .msg-sender { color: var(--text-muted); }

.msg-time {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.msg-body {
  padding: 8px 14px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 13.5px;
  line-height: 1.55;
}

.msg-user .msg-body {
  background: var(--accent-dim);
  border: 1px solid rgba(203, 166, 247, 0.12);
  color: var(--text-primary);
}

.msg-orchestrator .msg-body {
  background: var(--green-dim);
  border: 1px solid rgba(166, 227, 161, 0.1);
}

.msg-worker .msg-body {
  background: var(--orange-dim);
  border: 1px solid rgba(250, 179, 135, 0.1);
}

.msg-system .msg-body {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-style: italic;
  font-size: 12.5px;
  padding: 4px 0;
}

/* ── Escalation cards ───────────────────────────── */

.msg-escalation {
  background: var(--yellow-dim);
  border: 1px solid rgba(249, 226, 175, 0.15);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: 85%;
}

.msg-escalation.resolved {
  opacity: 0.5;
}

.escalation-title {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--yellow);
  font-size: 13px;
}

.escalation-detail {
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.escalation-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.escalation-buttons button {
  padding: 6px 16px;
  border: 1px solid var(--border-light);
  border-radius: 6px;
  background: var(--bg-surface);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s ease;
}

.escalation-buttons button:hover {
  background: var(--bg-hover);
}

.escalation-buttons button.approve {
  border-color: rgba(166, 227, 161, 0.4);
  color: var(--green);
}

.escalation-buttons button.approve:hover {
  background: var(--green-dim);
}

.escalation-buttons button.deny {
  border-color: rgba(243, 139, 168, 0.4);
  color: var(--red);
}

.escalation-buttons button.deny:hover {
  background: rgba(243, 139, 168, 0.1);
}

.escalation-resolution {
  margin-top: 8px;
  color: var(--text-muted);
  font-style: italic;
  font-size: 12.5px;
}

/* ── Input area ─────────────────────────────────── */

#input-area {
  padding: 12px 20px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  position: relative;
  flex-shrink: 0;
}

#input {
  flex: 1;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 14px;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

#input::placeholder {
  color: var(--text-muted);
}

#input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(203, 166, 247, 0.15);
}

#send-btn {
  padding: 10px 20px;
  background: var(--accent);
  color: var(--bg-primary);
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

#send-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

#send-btn:active {
  transform: translateY(0);
}

#send-btn:disabled {
  background: var(--bg-hover);
  color: var(--text-muted);
  cursor: not-allowed;
  transform: none;
  filter: none;
}

/* ── @mention dropdown ──────────────────────────── */

#mention-dropdown {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 20px;
  margin-bottom: 4px;
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  min-width: 220px;
  max-height: 180px;
  overflow-y: auto;
  z-index: 200;
  box-shadow: 0 -6px 20px rgba(0,0,0,0.4);
  padding: 4px 0;
}

#mention-dropdown.open {
  display: block;
}

.mention-item {
  padding: 8px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  transition: background 0.08s ease;
}

.mention-item:hover,
.mention-item.active {
  background: var(--accent-dim);
}

.mention-item .mention-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.mention-item .mention-dot.orchestrator { background: var(--green); }
.mention-item .mention-dot.worker { background: var(--orange); }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">Channels</div>
  <div id="channel-list"></div>
  <button id="new-channel-btn">+ New Channel</button>
</div>

<div id="main">
  <div id="header">
    <h1 id="channel-title">distributed-cc</h1>
    <div id="header-right">
      <button id="members-btn" style="display:none">
        0 members
        <div id="members-popover"></div>
      </button>
      <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">disconnected</span>
      </div>
    </div>
  </div>

  <div id="no-channel-msg">Select or create a channel to start</div>
  <div id="messages" style="display:none"></div>

  <div id="input-area">
    <div id="mention-dropdown"></div>
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const noChannelEl = document.getElementById('no-channel-msg');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const channelListEl = document.getElementById('channel-list');
const channelTitle = document.getElementById('channel-title');
const newChannelBtn = document.getElementById('new-channel-btn');
const membersBtn = document.getElementById('members-btn');
const membersPopover = document.getElementById('members-popover');
const mentionDropdown = document.getElementById('mention-dropdown');

let ws = null;
let reconnectTimer = null;
let activeChannel = null;
let channels = [];
let channelMembers = [];

// ── @mention state ──────────────────────────────────────────────────
let mentionState = { active: false, startIndex: -1, query: '' };
let mentionActiveIdx = 0;

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTime() {
  const now = new Date();
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Message parsing ─────────────────────────────────────────────────

function parseMessage(text, cssClass) {
  if (cssClass === 'msg-user') {
    return { role: 'user', label: 'You', body: text };
  }
  if (cssClass === 'msg-system') {
    return { role: 'system', label: 'System', body: text };
  }

  // orchestrator -> server/session: ...
  let m = text.match(/^orchestrator\s*->\s*([\w./-]+):\s*([\s\S]*)$/);
  if (m) {
    return { role: 'orchestrator', label: 'Orchestrator', body: m[2] };
  }

  // orchestrator: ...
  m = text.match(/^orchestrator:\s*([\s\S]*)$/);
  if (m) {
    return { role: 'orchestrator', label: 'Orchestrator', body: m[1] };
  }

  // server/session: ...  (worker)
  m = text.match(/^([\w.-]+\/[\w.-]+):\s*([\s\S]*)$/);
  if (m) {
    return { role: 'worker', label: m[1], body: m[2] };
  }

  return { role: 'orchestrator', label: 'Orchestrator', body: text };
}

function classifyMessage(text) {
  if (text.startsWith('(queued)') || text.startsWith('(noted)') || text.startsWith('(stop:')) {
    return 'system';
  }
  if (text.startsWith('orchestrator ->') || text.startsWith('orchestrator:')) {
    return 'orchestrator';
  }
  if (text.match(/^[\w.-]+\/[\w.-]+:/)) {
    return 'worker';
  }
  return 'orchestrator';
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, cssClass) {
  const parsed = parseMessage(text, cssClass);
  const div = document.createElement('div');
  div.className = 'msg ' + cssClass;

  const header = document.createElement('div');
  header.className = 'msg-header';

  const sender = document.createElement('span');
  sender.className = 'msg-sender';
  sender.textContent = parsed.label;

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = formatTime();

  header.appendChild(sender);
  header.appendChild(time);

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = parsed.body;

  div.appendChild(header);
  div.appendChild(body);
  messagesEl.appendChild(div);
  scrollToBottom();
}

function addEscalationCard(data) {
  const div = document.createElement('div');
  div.className = 'msg msg-escalation';
  div.id = 'esc-' + data.request_id;

  let html = '<div class="escalation-title">' + escapeHtml(data.title) + '</div>';
  html += '<div class="escalation-detail">' + escapeHtml(data.detail) + '</div>';

  if (data.type === 'permission_request') {
    html += '<div class="escalation-buttons">';
    html += '<button class="approve" onclick="resolvePermission(\'' + escapeHtml(data.request_id) + '\', true)">Approve</button>';
    html += '<button class="deny" onclick="resolvePermission(\'' + escapeHtml(data.request_id) + '\', false)">Deny</button>';
    html += '</div>';
  } else if (data.type === 'clarification_request') {
    html += '<div class="escalation-buttons">';
    const questions = data.questions || [];
    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      const options = q.options || [];
      for (let j = 0; j < options.length; j++) {
        const opt = options[j];
        html += '<button onclick="resolveClarification(\'' + escapeHtml(data.request_id)
          + '\', \'' + escapeHtml(q.question)
          + '\', \'' + escapeHtml(opt.label) + '\')">'
          + escapeHtml(opt.label) + '</button>';
      }
    }
    html += '</div>';
  }

  div.innerHTML = html;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function markEscalationResolved(requestId, resolution) {
  const div = document.getElementById('esc-' + requestId);
  if (div) {
    div.classList.add('resolved');
    const btns = div.querySelector('.escalation-buttons');
    if (btns) {
      btns.innerHTML = '<div class="escalation-resolution">&gt;&gt; ' + escapeHtml(resolution) + '</div>';
    }
  }
}

function resolvePermission(requestId, approved) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'permission_response',
    request_id: requestId,
    approved: approved,
    reason: approved ? 'Approved by user' : 'Denied by user'
  }));
  markEscalationResolved(requestId, approved ? 'APPROVED' : 'DENIED');
}

function resolveClarification(requestId, question, answer) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'clarification_response',
    request_id: requestId,
    question: question,
    answer: answer
  }));
  markEscalationResolved(requestId, answer);
}

// ── Channel management ──────────────────────────────────────────────

function renderChannelList() {
  channelListEl.innerHTML = '';
  for (const ch of channels) {
    const item = document.createElement('div');
    item.className = 'channel-item' + (activeChannel === ch.id ? ' active' : '');
    item.innerHTML = '<span class="hash">#</span><span class="ch-name">' + escapeHtml(ch.name) + '</span>';
    item.onclick = () => switchChannel(ch.id);

    const del = document.createElement('button');
    del.className = 'ch-delete';
    del.textContent = '\u00d7';
    del.title = 'Delete channel';
    del.onclick = (e) => { e.stopPropagation(); deleteChannel(ch.id, ch.name); };
    item.appendChild(del);

    channelListEl.appendChild(item);
  }
}

function deleteChannel(channelId, name) {
  if (!confirm('Delete #' + name + '? This cannot be undone.')) return;
  fetch('/api/channels/' + channelId, { method: 'DELETE' })
    .then(r => r.json())
    .then(() => {
      channels = channels.filter(c => c.id !== channelId);
      if (activeChannel === channelId) {
        activeChannel = null;
        channelTitle.textContent = 'distributed-cc';
        messagesEl.style.display = 'none';
        noChannelEl.style.display = 'flex';
        membersBtn.style.display = 'none';
        if (channels.length > 0) {
          switchChannel(channels[0].id);
        }
      }
      renderChannelList();
    });
}

function switchChannel(channelId) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'switch_channel', channel_id: channelId }));
  loadHistory(channelId);
  loadMembers(channelId);
}

function onChannelSwitched(channelId) {
  activeChannel = channelId;
  localStorage.setItem('dcc_active_channel', String(channelId));
  const ch = channels.find(c => c.id === channelId);
  channelTitle.textContent = ch ? '# ' + ch.name : 'distributed-cc';
  noChannelEl.style.display = 'none';
  messagesEl.style.display = 'flex';
  renderChannelList();
}

function loadChannels() {
  return fetch('/api/channels')
    .then(r => r.json())
    .then(list => {
      channels = list;
      renderChannelList();
      return list;
    });
}

function createChannel() {
  const name = prompt('Channel name:');
  if (!name || !name.trim()) return;
  fetch('/api/channels', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name.trim() }),
  })
    .then(r => r.json())
    .then(ch => {
      channels.push(ch);
      renderChannelList();
      switchChannel(ch.id);
    });
}

newChannelBtn.addEventListener('click', createChannel);

// ── Members ─────────────────────────────────────────────────────────

function loadMembers(channelId) {
  fetch('/api/channels/' + channelId + '/members')
    .then(r => r.json())
    .then(members => {
      channelMembers = members;
      membersBtn.style.display = '';
      membersBtn.childNodes[0].textContent = members.length + ' members ';
      renderMembersPopover();
    })
    .catch(() => {
      channelMembers = [];
      membersBtn.style.display = 'none';
    });
}

function renderMembersPopover() {
  let html = '';
  for (const m of channelMembers) {
    html += '<div class="member-item">';
    html += '<div class="member-dot ' + escapeHtml(m.role) + '"></div>';
    html += '<span class="member-name">' + escapeHtml(m.name) + '</span>';
    if (m.detail) {
      html += '<span class="member-detail">' + escapeHtml(m.detail) + '</span>';
    }
    html += '</div>';
  }
  membersPopover.innerHTML = html;
}

membersBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  membersPopover.classList.toggle('open');
});

document.addEventListener('click', function() {
  membersPopover.classList.remove('open');
});

// ── Messages ────────────────────────────────────────────────────────

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || activeChannel === null) return;

  addMessage(text, 'msg-user');
  ws.send(JSON.stringify({ type: 'message', text: text }));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  closeMentionDropdown();
}

function loadHistory(channelId) {
  fetch('/api/history?channel=' + channelId)
    .then(r => r.json())
    .then(messages => {
      messagesEl.innerHTML = '';
      for (const msg of messages) {
        if (msg.role === 'user') {
          addMessage(msg.content, 'msg-user');
        } else {
          const cls = classifyMessage(msg.content);
          addMessage(msg.content, 'msg-' + cls);
        }
      }
    })
    .catch(err => console.error('Failed to load history:', err));
}

// ── @mention autocomplete ───────────────────────────────────────────

function getMentionCandidates() {
  return channelMembers
    .filter(m => m.role !== 'user')
    .map(m => ({ name: m.name.toLowerCase() === 'orchestrator' ? 'orchestrator' : m.name, role: m.role }));
}

function openMentionDropdown(candidates) {
  mentionDropdown.innerHTML = '';
  for (let i = 0; i < candidates.length; i++) {
    const c = candidates[i];
    const item = document.createElement('div');
    item.className = 'mention-item' + (i === mentionActiveIdx ? ' active' : '');
    item.innerHTML = '<div class="mention-dot ' + escapeHtml(c.role) + '"></div>'
      + '<span>' + escapeHtml(c.name) + '</span>';
    item.addEventListener('mousedown', function(e) {
      e.preventDefault();
      selectMention(c.name);
    });
    mentionDropdown.appendChild(item);
  }
  mentionDropdown.classList.add('open');
}

function closeMentionDropdown() {
  mentionDropdown.classList.remove('open');
  mentionDropdown.innerHTML = '';
  mentionState = { active: false, startIndex: -1, query: '' };
  mentionActiveIdx = 0;
}

function selectMention(name) {
  const val = inputEl.value;
  const before = val.substring(0, mentionState.startIndex);
  const after = val.substring(inputEl.selectionStart);
  inputEl.value = before + '@' + name + ' ' + after;
  const cursorPos = before.length + 1 + name.length + 1;
  inputEl.setSelectionRange(cursorPos, cursorPos);
  closeMentionDropdown();
  inputEl.focus();
}

function updateMentionHighlight(candidates) {
  const items = mentionDropdown.querySelectorAll('.mention-item');
  items.forEach((el, i) => {
    el.classList.toggle('active', i === mentionActiveIdx);
  });
}

inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';

  const val = this.value;
  const cursor = this.selectionStart;
  const textBefore = val.substring(0, cursor);
  const atIdx = textBefore.lastIndexOf('@');

  if (atIdx >= 0 && (atIdx === 0 || /\s/.test(textBefore[atIdx - 1]))) {
    const query = textBefore.substring(atIdx + 1).toLowerCase();
    const candidates = getMentionCandidates().filter(c =>
      c.name.toLowerCase().startsWith(query)
    );
    if (candidates.length > 0) {
      mentionState = { active: true, startIndex: atIdx, query: query };
      mentionActiveIdx = Math.min(mentionActiveIdx, candidates.length - 1);
      openMentionDropdown(candidates);
      return;
    }
  }
  closeMentionDropdown();
});

inputEl.addEventListener('keydown', function(e) {
  if (mentionState.active && mentionDropdown.classList.contains('open')) {
    const items = mentionDropdown.querySelectorAll('.mention-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      mentionActiveIdx = (mentionActiveIdx + 1) % items.length;
      updateMentionHighlight();
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      mentionActiveIdx = (mentionActiveIdx - 1 + items.length) % items.length;
      updateMentionHighlight();
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      const candidates = getMentionCandidates().filter(c =>
        c.name.toLowerCase().startsWith(mentionState.query)
      );
      if (candidates[mentionActiveIdx]) {
        selectMention(candidates[mentionActiveIdx].name);
      }
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      closeMentionDropdown();
      return;
    }
  }

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// ── WebSocket ───────────────────────────────────────────────────────

function connect() {
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');

  ws.onopen = function() {
    statusDot.className = 'connected';
    statusText.textContent = 'connected';

    loadChannels().then(list => {
      if (list.length === 0) return;
      const saved = parseInt(localStorage.getItem('dcc_active_channel'), 10);
      const target = list.find(c => c.id === saved) ? saved : list[0].id;
      switchChannel(target);
    });
  };

  ws.onclose = function() {
    statusDot.className = 'disconnected';
    statusText.textContent = 'disconnected';
    reconnectTimer = setTimeout(connect, 2000);
  };

  ws.onerror = function() {
    ws.close();
  };

  ws.onmessage = function(event) {
    const data = JSON.parse(event.data);

    if (data.type === 'channel_switched') {
      onChannelSwitched(data.channel_id);
    } else if (data.type === 'reply') {
      const cls = classifyMessage(data.text);
      addMessage(data.text, 'msg-' + cls);
    } else if (data.type === 'permission_request' || data.type === 'clarification_request') {
      addEscalationCard(data);
    } else if (data.type === 'escalation_resolved') {
      markEscalationResolved(data.request_id, data.resolution);
    } else if (data.type === 'error') {
      addMessage('Error: ' + data.text, 'msg-system');
    }
  };
}

connect();
</script>
