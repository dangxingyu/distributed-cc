<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>distributed-cc</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1e1e2e;
  --bg-secondary: #181825;
  --bg-surface: #242438;
  --bg-hover: #2a2a40;
  --bg-active: #333352;
  --border: #33334d;
  --border-light: #3e3e5c;
  --text-primary: #cdd6f4;
  --text-secondary: #a6adc8;
  --text-muted: #6c7086;
  --blue: #89b4fa;
  --blue-dim: rgba(137, 180, 250, 0.1);
  --green: #a6e3a1;
  --green-dim: rgba(166, 227, 161, 0.1);
  --orange: #fab387;
  --orange-dim: rgba(250, 179, 135, 0.1);
  --yellow: #f9e2af;
  --yellow-dim: rgba(249, 226, 175, 0.1);
  --red: #f38ba8;
  --accent: #cba6f7;
  --accent-dim: rgba(203, 166, 247, 0.15);
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: row;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Scrollbar ──────────────────────────────────── */

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ── Sidebar ─────────────────────────────────────── */

#sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#sidebar-header {
  padding: 16px 18px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

#channel-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 8px;
}

.channel-item {
  padding: 6px 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  transition: all 0.12s ease;
  margin-bottom: 1px;
}

.channel-item:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.channel-item.active {
  background: var(--accent-dim);
  color: var(--accent);
}

.channel-item .ch-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.channel-item .hash {
  color: var(--text-muted);
  font-weight: 700;
  font-size: 15px;
  opacity: 0.6;
}

.channel-item.active .hash {
  color: var(--accent);
  opacity: 1;
}

.channel-item .ch-status {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.channel-item .ch-status.running { background: var(--green); animation: pulse 2s infinite; }
.channel-item .ch-status.idle { background: var(--text-muted); }
.channel-item .ch-status.done { background: var(--blue); }
.channel-item .ch-status.stuck { background: var(--yellow); }
.channel-item .ch-status.error { background: var(--red); }
.channel-item .ch-status.disconnected { background: var(--red); opacity: 0.5; }
.channel-item .ch-status.unconnected { background: transparent; border: 1px dashed var(--text-muted); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.channel-item .ch-delete {
  display: none;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
  border-radius: 4px;
  flex-shrink: 0;
  transition: color 0.1s ease;
}

.channel-item:hover .ch-delete {
  display: block;
}

.channel-item .ch-delete:hover {
  color: var(--red);
}

#new-channel-btn {
  margin: 4px 8px 8px;
  padding: 8px 12px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  background: none;
  border: 1px dashed var(--border);
  border-radius: 6px;
  text-align: left;
  transition: all 0.12s ease;
}

#new-channel-btn:hover {
  background: var(--bg-hover);
  color: var(--text-secondary);
  border-color: var(--border-light);
}

/* ── Main area ───────────────────────────────────── */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 0;
  background: var(--bg-primary);
}

#header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  flex-shrink: 0;
}

#header h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}

#header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

#project-badge {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  display: none;
}

#project-badge.running {
  border-color: rgba(166, 227, 161, 0.3);
  color: var(--green);
}

#project-badge.stuck {
  border-color: rgba(249, 226, 175, 0.3);
  color: var(--yellow);
}

#project-badge.error {
  border-color: rgba(243, 139, 168, 0.3);
  color: var(--red);
}

#members-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  cursor: pointer;
  position: relative;
  transition: all 0.12s ease;
}

#members-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-light);
}

#members-popover {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  min-width: 320px;
  padding: 6px 0;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

#members-popover.open {
  display: block;
}

.member-item {
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  transition: background 0.1s ease;
}

.member-item:hover {
  background: var(--bg-hover);
}

.member-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.member-dot.user { background: var(--blue); }
.member-dot.orchestrator { background: var(--green); }
.member-dot.worker { background: var(--orange); }

.member-name {
  color: var(--text-primary);
  font-weight: 500;
  white-space: nowrap;
}

.member-detail {
  color: var(--text-muted);
  font-size: 11px;
  margin-left: auto;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#status {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}

#status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
}

#status-dot.connected { background: var(--green); }
#status-dot.disconnected { background: var(--red); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#no-channel-msg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 15px;
  gap: 8px;
}

#no-channel-msg::before {
  content: '#';
  font-size: 48px;
  font-weight: 800;
  opacity: 0.15;
}

/* ── Message bubbles ────────────────────────────── */

.msg {
  padding: 6px 0;
  line-height: 1.6;
  max-width: 85%;
}

.msg-user {
  align-self: flex-start;
}

.msg-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}

.msg-sender {
  font-size: 13px;
  font-weight: 600;
}

.msg-user .msg-sender { color: var(--blue); }
.msg-orchestrator .msg-sender { color: var(--green); }
.msg-system .msg-sender { color: var(--text-muted); }

.msg-time {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.msg-body {
  padding: 8px 14px;
  border-radius: 8px;
  word-wrap: break-word;
  font-size: 13.5px;
  line-height: 1.55;
}

/* ── Rendered markdown in messages ───────────── */

.msg-body p { margin: 0 0 8px 0; }
.msg-body p:last-child { margin-bottom: 0; }

.msg-body strong { font-weight: 600; }

.msg-body code {
  background: rgba(0, 0, 0, 0.25);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
  font-size: 12.5px;
}

.msg-body pre {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin: 6px 0;
  overflow-x: auto;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
  font-size: 12px;
  line-height: 1.5;
}

.msg-body pre code {
  background: none;
  padding: 0;
  border-radius: 0;
  font-size: inherit;
}

.msg-body table {
  border-collapse: collapse;
  margin: 6px 0;
  width: 100%;
  font-size: 13px;
}

.msg-body th,
.msg-body td {
  border: 1px solid var(--border-light);
  padding: 5px 10px;
  text-align: left;
}

.msg-body th {
  background: rgba(0, 0, 0, 0.2);
  font-weight: 600;
}

.msg-body tr:nth-child(even) {
  background: rgba(0, 0, 0, 0.08);
}

.msg-body ul, .msg-body ol {
  margin: 4px 0;
  padding-left: 22px;
}

.msg-body li { margin-bottom: 2px; }

.msg-body blockquote {
  border-left: 3px solid var(--border-light);
  padding-left: 12px;
  margin: 6px 0;
  color: var(--text-secondary);
}

.msg-body a {
  color: var(--blue);
  text-decoration: none;
}

.msg-body a:hover {
  text-decoration: underline;
}

.msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
  margin: 8px 0 4px;
  font-weight: 600;
}

.msg-body h1 { font-size: 1.2em; }
.msg-body h2 { font-size: 1.1em; }
.msg-body h3 { font-size: 1.05em; }

.msg-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
}

.msg-user .msg-body {
  background: var(--accent-dim);
  border: 1px solid rgba(203, 166, 247, 0.12);
  color: var(--text-primary);
}

.msg-orchestrator .msg-body {
  background: var(--green-dim);
  border: 1px solid rgba(166, 227, 161, 0.1);
}

.msg-system .msg-body {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-style: italic;
  font-size: 12.5px;
  padding: 4px 0;
}

/* ── Escalation cards ───────────────────────────── */

.msg-escalation {
  background: var(--yellow-dim);
  border: 1px solid rgba(249, 226, 175, 0.15);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: 85%;
}

.msg-escalation.resolved {
  opacity: 0.5;
}

.escalation-title {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--yellow);
  font-size: 13px;
}

.escalation-detail {
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  white-space: pre-wrap;
}

.escalation-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.escalation-buttons button {
  padding: 6px 16px;
  border: 1px solid var(--border-light);
  border-radius: 6px;
  background: var(--bg-surface);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s ease;
}

.escalation-buttons button:hover {
  background: var(--bg-hover);
}

.escalation-buttons button.approve {
  border-color: rgba(166, 227, 161, 0.4);
  color: var(--green);
}

.escalation-buttons button.approve:hover {
  background: var(--green-dim);
}

.escalation-buttons button.deny {
  border-color: rgba(243, 139, 168, 0.4);
  color: var(--red);
}

.escalation-buttons button.deny:hover {
  background: rgba(243, 139, 168, 0.1);
}

.escalation-resolution {
  margin-top: 8px;
  color: var(--text-muted);
  font-style: italic;
  font-size: 12.5px;
}

/* ── Typing indicator ───────────────────────────── */

#typing-indicator {
  height: 0;
  overflow: hidden;
  padding: 0 24px;
  font-size: 12.5px;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: height 0.15s ease, padding 0.15s ease;
}

#typing-indicator.active {
  height: 28px;
  padding: 2px 24px;
}

#typing-indicator .dot-pulse {
  display: inline-flex;
  gap: 3px;
}

#typing-indicator .dot-pulse span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--green);
  animation: dotPulse 1.4s ease-in-out infinite;
}

#typing-indicator .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
#typing-indicator .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── Input area ─────────────────────────────────── */

#input-area {
  padding: 12px 20px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  position: relative;
  flex-shrink: 0;
}

#input {
  flex: 1;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 14px;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

#input::placeholder {
  color: var(--text-muted);
}

#input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(203, 166, 247, 0.15);
}

#send-btn {
  padding: 10px 20px;
  background: var(--accent);
  color: var(--bg-primary);
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

#send-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

#send-btn:active {
  transform: translateY(0);
}

#send-btn:disabled {
  background: var(--bg-hover);
  color: var(--text-muted);
  cursor: not-allowed;
  transform: none;
  filter: none;
}

/* ── Monitor panel ─────────────────────────────── */

#monitor {
  width: 350px;
  min-width: 0;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  transition: width 0.2s ease;
}

#monitor.monitor-closed {
  width: 0;
  border-left: none;
}

#monitor-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

#monitor-header h2 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

#monitor-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
  border-radius: 4px;
  transition: color 0.1s ease;
}

#monitor-close:hover {
  color: var(--text-primary);
}

#monitor-log {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
  font-size: 12px;
  line-height: 1.5;
}

.log-entry {
  padding: 3px 14px;
  border-bottom: 1px solid rgba(51, 51, 77, 0.4);
  word-break: break-all;
}

.log-entry-tool {
  color: var(--blue);
}

.log-entry-text {
  color: var(--text-muted);
}

.log-entry-error {
  color: var(--red);
}

.log-entry-iteration {
  color: var(--accent);
  font-weight: 500;
}

.log-time {
  color: var(--text-muted);
  opacity: 0.6;
  margin-right: 6px;
  font-size: 10px;
}

#monitor-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  cursor: pointer;
  transition: all 0.12s ease;
}

#monitor-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-light);
}

#monitor-btn.active {
  background: var(--blue-dim);
  border-color: rgba(137, 180, 250, 0.3);
  color: var(--blue);
}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">Channels</div>
  <div id="channel-list"></div>
  <button id="new-channel-btn">+ New Channel</button>
</div>

<div id="main">
  <div id="header">
    <h1 id="channel-title">distributed-cc</h1>
    <div id="header-right">
      <div id="project-badge"></div>
      <button id="monitor-btn" onclick="toggleMonitor()" title="Toggle monitor (Ctrl+M)">Monitor</button>
      <button id="members-btn" style="display:none">
        0 members
        <div id="members-popover"></div>
      </button>
      <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">disconnected</span>
      </div>
    </div>
  </div>

  <div id="no-channel-msg">Select or create a channel to start</div>
  <div id="messages" style="display:none"></div>

  <div id="typing-indicator"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="monitor" class="monitor-closed">
  <div id="monitor-header">
    <h2>Monitor</h2>
    <button id="monitor-close" onclick="toggleMonitor()">&times;</button>
  </div>
  <div id="monitor-log"></div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const noChannelEl = document.getElementById('no-channel-msg');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const channelListEl = document.getElementById('channel-list');
const channelTitle = document.getElementById('channel-title');
const newChannelBtn = document.getElementById('new-channel-btn');
const membersBtn = document.getElementById('members-btn');
const membersPopover = document.getElementById('members-popover');
const monitorEl = document.getElementById('monitor');
const monitorLog = document.getElementById('monitor-log');
const monitorBtn = document.getElementById('monitor-btn');
const typingIndicator = document.getElementById('typing-indicator');
const projectBadge = document.getElementById('project-badge');

let ws = null;
let reconnectTimer = null;
let activeChannel = null;
let channels = [];
let channelMembers = [];
let currentProjectId = null;
let currentProjectStatus = 'unknown';
let currentIteration = 0;

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTime() {
  const now = new Date();
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Status display ──────────────────────────────────────────────────

function updateProjectBadge(status, iteration, data) {
  if (!currentProjectId) {
    projectBadge.style.display = 'none';
    return;
  }
  projectBadge.style.display = '';
  projectBadge.className = status || '';

  if (status === 'running' || status === 'busy') {
    projectBadge.textContent = iteration ? `Working (${iteration})` : 'Working...';
    showTypingIndicator(data || 'working');
  } else if (status === 'stuck') {
    projectBadge.textContent = 'Needs input';
    hideTypingIndicator();
  } else if (status === 'done') {
    projectBadge.textContent = 'Done';
    hideTypingIndicator();
  } else if (status === 'error') {
    projectBadge.textContent = 'Error';
    hideTypingIndicator();
  } else if (status === 'idle') {
    projectBadge.textContent = currentProjectId;
    hideTypingIndicator();
  } else {
    projectBadge.textContent = currentProjectId;
    hideTypingIndicator();
  }
}

// ── Typing indicator ─────────────────────────────────────────────────

let _hideTimer = null;
let _indicatorActive = false;

function showTypingIndicator(label) {
  if (_hideTimer) { clearTimeout(_hideTimer); _hideTimer = null; }
  if (_indicatorActive) return;
  _indicatorActive = true;

  typingIndicator.innerHTML =
    '<span class="dot-pulse"><span></span><span></span><span></span></span>' +
    '<span class="status-label">orchestrator is working</span>';
  typingIndicator.classList.add('active');
}

function hideTypingIndicator() {
  if (_hideTimer) clearTimeout(_hideTimer);
  _hideTimer = setTimeout(() => {
    _indicatorActive = false;
    typingIndicator.classList.remove('active');
    _hideTimer = null;
  }, 800);
}

// ── Message rendering ────────────────────────────────────────────────

function renderMarkdown(text) {
  if (typeof marked !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true });
    return marked.parse(text);
  }
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function classifyMessage(text) {
  if (text.startsWith('(queued') || text.startsWith('(stop')) {
    return 'system';
  }
  return 'orchestrator';
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, cssClass) {
  let label = 'Orchestrator';
  let body = text;

  if (cssClass === 'msg-user') {
    label = 'You';
    body = text;
  } else if (cssClass === 'msg-system') {
    label = 'System';
  }

  const div = document.createElement('div');
  div.className = 'msg ' + cssClass;

  const header = document.createElement('div');
  header.className = 'msg-header';

  const sender = document.createElement('span');
  sender.className = 'msg-sender';
  sender.textContent = label;

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = formatTime();

  header.appendChild(sender);
  header.appendChild(time);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'msg-body';
  if (cssClass === 'msg-user') {
    bodyEl.textContent = body;
  } else {
    bodyEl.innerHTML = renderMarkdown(body);
  }

  div.appendChild(header);
  div.appendChild(bodyEl);
  messagesEl.appendChild(div);
  scrollToBottom();
}

function addEscalationCard(data) {
  const div = document.createElement('div');
  div.className = 'msg msg-escalation';
  div.id = 'esc-' + data.request_id;

  let html = '<div class="escalation-title">' + escapeHtml(data.title) + '</div>';
  html += '<div class="escalation-detail">' + escapeHtml(data.detail) + '</div>';
  html += '<div class="escalation-buttons">';
  html += '<button class="approve" onclick="resolvePermission(\'' + escapeHtml(data.request_id) + '\', true)">Approve</button>';
  html += '<button class="deny" onclick="resolvePermission(\'' + escapeHtml(data.request_id) + '\', false)">Deny</button>';
  html += '</div>';

  div.innerHTML = html;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function markEscalationResolved(requestId, resolution) {
  const div = document.getElementById('esc-' + requestId);
  if (div) {
    div.classList.add('resolved');
    const btns = div.querySelector('.escalation-buttons');
    if (btns) {
      btns.innerHTML = '<div class="escalation-resolution">&gt;&gt; ' + escapeHtml(resolution) + '</div>';
    }
  }
}

function resolvePermission(requestId, approved) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'permission_response',
    request_id: requestId,
    approved: approved,
    reason: approved ? 'Approved by user' : 'Denied by user'
  }));
  markEscalationResolved(requestId, approved ? 'APPROVED' : 'DENIED');
}

// ── Channel management ──────────────────────────────────────────────

function renderChannelList() {
  channelListEl.innerHTML = '';
  for (const ch of channels) {
    const item = document.createElement('div');
    item.className = 'channel-item' + (activeChannel === ch.id ? ' active' : '');

    const status = ch.project_status || 'unconnected';
    item.innerHTML = '<span class="hash">#</span>'
      + '<span class="ch-name">' + escapeHtml(ch.name) + '</span>'
      + '<span class="ch-status ' + escapeHtml(status) + '"></span>';
    item.onclick = () => switchChannel(ch.id);

    const del = document.createElement('button');
    del.className = 'ch-delete';
    del.textContent = '\u00d7';
    del.title = 'Delete channel';
    del.onclick = (e) => { e.stopPropagation(); deleteChannel(ch.id, ch.name); };
    item.appendChild(del);

    channelListEl.appendChild(item);
  }
}

function deleteChannel(channelId, name) {
  if (!confirm('Delete #' + name + '? This cannot be undone.')) return;
  fetch('/api/channels/' + channelId, { method: 'DELETE' })
    .then(r => r.json())
    .then(() => {
      channels = channels.filter(c => c.id !== channelId);
      if (activeChannel === channelId) {
        activeChannel = null;
        channelTitle.textContent = 'distributed-cc';
        messagesEl.style.display = 'none';
        noChannelEl.style.display = 'flex';
        membersBtn.style.display = 'none';
        if (channels.length > 0) {
          switchChannel(channels[0].id);
        }
      }
      renderChannelList();
    });
}

function switchChannel(channelId) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'switch_channel', channel_id: channelId }));
  loadHistory(channelId);
  loadMembers(channelId);
  loadLogs(channelId);
}

function onChannelSwitched(data) {
  activeChannel = data.channel_id;
  currentProjectId = data.project_id || null;
  currentProjectStatus = data.project_status || 'unknown';
  localStorage.setItem('dcc_active_channel', String(activeChannel));

  const ch = channels.find(c => c.id === activeChannel);
  channelTitle.textContent = ch ? '# ' + ch.name : 'distributed-cc';
  noChannelEl.style.display = 'none';
  messagesEl.style.display = 'flex';
  monitorLog.innerHTML = '';

  updateProjectBadge(currentProjectStatus, 0);
  renderChannelList();
}

function loadChannels() {
  return fetch('/api/channels')
    .then(r => r.json())
    .then(list => {
      channels = list;
      renderChannelList();
      return list;
    });
}

function createChannel() {
  const name = prompt('Channel name:');
  if (!name || !name.trim()) return;

  // Ask which project to connect
  fetch('/api/projects')
    .then(r => r.json())
    .then(projects => {
      let projectId = '';
      if (projects.length > 0) {
        const choices = projects.map(p => p.project_id).join(', ');
        projectId = prompt('Connect to project? (' + choices + ')\nLeave empty to connect later:') || '';
      }

      fetch('/api/channels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.trim(), project_id: projectId.trim() }),
      })
        .then(r => r.json())
        .then(ch => {
          channels.push(ch);
          renderChannelList();
          switchChannel(ch.id);
        });
    });
}

newChannelBtn.addEventListener('click', createChannel);

// ── Members ─────────────────────────────────────────────────────────

function loadMembers(channelId) {
  fetch('/api/channels/' + channelId + '/members')
    .then(r => r.json())
    .then(members => {
      channelMembers = members;
      membersBtn.style.display = '';
      membersBtn.childNodes[0].textContent = members.length + ' members ';
      renderMembersPopover();
    })
    .catch(() => {
      channelMembers = [];
      membersBtn.style.display = 'none';
    });
}

function renderMembersPopover() {
  let html = '';
  for (const m of channelMembers) {
    html += '<div class="member-item">';
    html += '<div class="member-dot ' + escapeHtml(m.role) + '"></div>';
    html += '<span class="member-name">' + escapeHtml(m.name) + '</span>';
    if (m.detail) {
      html += '<span class="member-detail">' + escapeHtml(m.detail) + '</span>';
    }
    html += '</div>';
  }
  membersPopover.innerHTML = html;
}

membersBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  membersPopover.classList.toggle('open');
});

document.addEventListener('click', function() {
  membersPopover.classList.remove('open');
});

// ── Messages ────────────────────────────────────────────────────────

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || activeChannel === null) return;

  addMessage(text, 'msg-user');
  ws.send(JSON.stringify({ type: 'message', text: text }));
  inputEl.value = '';
  inputEl.style.height = 'auto';
}

function loadHistory(channelId) {
  fetch('/api/history?channel=' + channelId)
    .then(r => r.json())
    .then(messages => {
      messagesEl.innerHTML = '';
      for (const msg of messages) {
        if (msg.role === 'user') {
          addMessage(msg.content, 'msg-user');
        } else {
          const cls = classifyMessage(msg.content);
          addMessage(msg.content, 'msg-' + cls);
        }
      }
    })
    .catch(err => console.error('Failed to load history:', err));
}

function loadLogs(channelId) {
  fetch('/api/logs?channel=' + channelId)
    .then(r => r.json())
    .then(logs => {
      monitorLog.innerHTML = '';
      for (const entry of logs) {
        addLogEntry(entry.text, entry.ts);
      }
    })
    .catch(err => console.error('Failed to load logs:', err));
}

inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// ── Monitor panel ───────────────────────────────────────────────────

function toggleMonitor() {
  const isOpen = !monitorEl.classList.contains('monitor-closed');
  if (isOpen) {
    monitorEl.classList.add('monitor-closed');
    monitorBtn.classList.remove('active');
    localStorage.setItem('dcc_monitor_open', 'false');
  } else {
    monitorEl.classList.remove('monitor-closed');
    monitorBtn.classList.add('active');
    localStorage.setItem('dcc_monitor_open', 'true');
  }
}

let _monitorScrollPending = false;

function addLogEntry(text, ts) {
  const entry = document.createElement('div');
  const isError = text.startsWith('[ERROR]');
  const isToolCall = /^orchestrator\s*->/.test(text);
  const isIteration = /^Iteration\s+\d/.test(text);
  const cls = isError ? 'log-entry-error' : isIteration ? 'log-entry-iteration' : isToolCall ? 'log-entry-tool' : 'log-entry-text';
  entry.className = 'log-entry ' + cls;

  const time = document.createElement('span');
  time.className = 'log-time';
  const d = ts ? new Date(ts * 1000) : new Date();
  time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const content = document.createElement('span');
  content.textContent = text;

  entry.appendChild(time);
  entry.appendChild(content);
  monitorLog.appendChild(entry);

  if (!_monitorScrollPending) {
    _monitorScrollPending = true;
    requestAnimationFrame(() => {
      monitorLog.scrollTop = monitorLog.scrollHeight;
      _monitorScrollPending = false;
    });
  }
}

// Restore monitor state from localStorage
if (localStorage.getItem('dcc_monitor_open') === 'true') {
  monitorEl.classList.remove('monitor-closed');
  monitorBtn.classList.add('active');
}

// Ctrl+M keyboard shortcut
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'm') {
    e.preventDefault();
    toggleMonitor();
  }
});

// ── WebSocket ───────────────────────────────────────────────────────

function connect() {
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');

  ws.onopen = function() {
    statusDot.className = 'connected';
    statusText.textContent = 'connected';

    loadChannels().then(list => {
      if (list.length === 0) return;
      const saved = parseInt(localStorage.getItem('dcc_active_channel'), 10);
      const target = list.find(c => c.id === saved) ? saved : list[0].id;
      switchChannel(target);
    });
  };

  ws.onclose = function() {
    statusDot.className = 'disconnected';
    statusText.textContent = 'disconnected';
    reconnectTimer = setTimeout(connect, 2000);
  };

  ws.onerror = function() {
    ws.close();
  };

  ws.onmessage = function(event) {
    const data = JSON.parse(event.data);

    if (data.type === 'channel_switched') {
      onChannelSwitched(data);

    } else if (data.type === 'project_connected') {
      currentProjectId = data.project_id;
      currentProjectStatus = data.project_status || 'idle';
      updateProjectBadge(currentProjectStatus, 0);
      loadChannels();  // refresh sidebar status dots

    } else if (data.type === 'progress') {
      const pStatus = data.status || data.type;
      currentIteration = data.iteration || currentIteration;
      if (pStatus === 'done' || pStatus === 'stuck' || pStatus === 'error') {
        currentProjectStatus = pStatus;
      } else {
        currentProjectStatus = 'running';
      }
      updateProjectBadge(currentProjectStatus, currentIteration, data.data);

      // Log iteration markers
      if (data.data && !data.status) {
        addLogEntry(data.data);
      }

    } else if (data.type === 'log') {
      addLogEntry(data.text);

    } else if (data.type === 'reply') {
      const cls = classifyMessage(data.text);
      addMessage(data.text, 'msg-' + cls);
      if (activeChannel !== null) loadMembers(activeChannel);

    } else if (data.type === 'permission_request') {
      addEscalationCard(data);

    } else if (data.type === 'escalation_resolved') {
      markEscalationResolved(data.request_id, data.resolution);

    } else if (data.type === 'error') {
      addMessage('Error: ' + data.text, 'msg-system');
    }
  };
}

connect();
</script>
