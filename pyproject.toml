[project]
name = "distributed-cc"
version = "0.1.0"
description = "Distribute Claude Code sessions across multiple servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "claude-agent-sdk",
]

[project.urls]
Homepage = "https://github.com/dangxingyu/distributed-cc"
Repository = "https://github.com/dangxingyu/distributed-cc"

[project.optional-dependencies]
daemon = ["claude-agent-sdk", "aiohttp>=3.9.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that call real Claude API (cost money)",
]
