[project]
name = "distributed-cc"
version = "0.1.0"
description = "Distribute Claude Code sessions across multiple servers"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "claude-agent-sdk",
]

[project.optional-dependencies]
broker = ["claude-agent-sdk", "aiohttp>=3.9.0"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that call real Claude API (cost money)",
]
